version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: sla-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./sla_recovery.db
      - SECRET_KEY=your-secret-key-change-in-production
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - UPLOAD_DIR=/app/uploads
      - API_HOST=0.0.0.0
      - API_PORT=8000
    volumes:
      - ./sla_recovery.db:/app/sla_recovery.db
      - ./uploads:/app/uploads
      - ./.env:/app/.env
    networks:
      - sla-network
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: sla-frontend
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
    volumes:
      - ./frontend:/app/frontend
      - ./sample_data:/app/sample_data
      - ./.env:/app/.env
    networks:
      - sla-network
    depends_on:
      - backend
    restart: unless-stopped

networks:
  sla-network:
    driver: bridge

volumes:
  db_data:
    driver: local
  uploads_data:
    driver: local
